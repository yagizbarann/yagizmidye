<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Başarılı</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #111827;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 13px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">✅</div>
    <h1>Siparişiniz Alındı</h1>
    <p>Yağız Midye ekibi siparişinizi hazırlamaya başladı.</p>

    <a href="/customer/menu">Yeni Sipariş Ver</a>
</div>

</body>
</html>
