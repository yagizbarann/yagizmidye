<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personel Girişi - Yağız Midye</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111827;
        }

        .login-card {
            width: 420px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            border: none;
            background: #f59e0b;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #111827;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Personel Girişi</h1>
    <p class="subtitle">Admin veya garson hesabınızla giriş yapın.</p>

    <div class="error" th:if="${param.error}">
        Kullanıcı adı veya şifre hatalı.
    </div>

    <form action="/login" method="post">
        <label>Kullanıcı Adı</label>
        <input type="text" name="username" placeholder="admin veya garson" required>

        <label>Şifre</label>
        <input type="password" name="password" placeholder="Şifrenizi girin" required>

        <button type="submit">Giriş Yap</button>
    </form>

    <a class="back" href="/">Ana Sayfaya Dön</a>
</div>

</body>
</html>
