<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yağız Midye - Admin Paneli</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 14px;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 16px;
        }

        .stat-card p {
            margin-top: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .cancelled-card {
            background: #dc2626;
        }

        .form-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto;
            gap: 12px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }

        input[type="file"] {
            padding: 10px;
        }

        button {
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .add-btn {
            background: #16a34a;
        }

        .delete-btn {
            background: #dc2626;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f59e0b;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .product-image {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            background: #e5e7eb;
        }

        .empty-image {
            width: 90px;
            height: 65px;
            border-radius: 8px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 12px;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 0.8fr 1fr 1.3fr 0.8fr auto;
            gap: 10px;
            align-items: start;
        }

        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .edit-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

<div class="navbar">
    <span>Yağız Midye Admin Paneli</span>
    <a href="/logout">Çıkış</a>
</div>

<div class="container">

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Toplam Ürün</h3>
            <p th:text="${productCount}"></p>
        </div>

        <div class="stat-card">
            <h3>Toplam Sipariş</h3>
            <p th:text="${orderCount}"></p>
        </div>

        <div class="stat-card">
            <h3>Toplam Ciro</h3>
            <p th:text="${totalRevenue} + ' TL'"></p>
        </div>

        <div class="stat-card">
            <h3>Bekleyen Sipariş</h3>
            <p th:text="${pendingOrders}"></p>
        </div>

        <div class="stat-card cancelled-card">
            <h3>İptal Edilen Sipariş</h3>
            <p th:text="${cancelledOrders}"></p>
        </div>
    </div>

    <h1>Ürün Yönetimi</h1>
    <p class="subtitle">Menü ürünlerini buradan ekleyebilir, güncelleyebilir ve silebilirsiniz.</p>

    <div class="form-box">
        <h2>Yeni Ürün Ekle</h2>

        <form th:action="@{/admin/products/add}"
              th:object="${product}"
              method="post"
              enctype="multipart/form-data"
              class="form-grid">

            <input type="text" th:field="*{name}" placeholder="Ürün adı" required>

            <input type="text" th:field="*{description}" placeholder="Açıklama" required>

            <input type="number" th:field="*{price}" placeholder="Fiyat" step="0.01" required>

            <select th:field="*{category}" required>
                <option value="">Kategori Seç</option>
                <option value="Midye Dolma">Midye Dolma</option>
                <option value="Kokoreç">Kokoreç</option>
                <option value="Çiğköfte">Çiğköfte</option>
                <option value="Balık Ekmek">Balık Ekmek</option>
            </select>

            <input type="file" name="imageFile" accept="image/*">

            <button type="submit" class="add-btn">
                Ekle
            </button>

        </form>
    </div>

    <h2>Ürün Listesi</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Görsel</th>
            <th>Ürün Bilgileri</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">

            <td th:text="${product.id}"></td>

            <td>
                <img class="product-image"
                     th:if="${product.imageUrl != null and product.imageUrl != ''}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}">

                <div class="empty-image"
                     th:if="${product.imageUrl == null or product.imageUrl == ''}">
                    Yok
                </div>
            </td>

            <td>
                <form th:action="@{/admin/products/update/{id}(id=${product.id})}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="edit-grid">

                        <input type="text" name="name" th:value="${product.name}" required>

                        <input type="text" name="description" th:value="${product.description}" required>

                        <input type="number" name="price" th:value="${product.price}" step="0.01" required>

                        <select name="category" required>
                            <option value="Midye Dolma"
                                    th:selected="${product.category == 'Midye Dolma'}">
                                Midye Dolma
                            </option>

                            <option value="Kokoreç"
                                    th:selected="${product.category == 'Kokoreç'}">
                                Kokoreç
                            </option>

                            <option value="Çiğköfte"
                                    th:selected="${product.category == 'Çiğköfte'}">
                                Çiğköfte
                            </option>

                            <option value="Balık Ekmek"
                                    th:selected="${product.category == 'Balık Ekmek'}">
                                Balık Ekmek
                            </option>
                        </select>

                        <input type="file" name="imageFile" accept="image/*">

                        <select name="active">
                            <option value="true" th:selected="${product.active == true}">Aktif</option>
                            <option value="false" th:selected="${product.active == false}">Pasif</option>
                        </select>

                        <button type="submit" class="add-btn">Güncelle</button>

                    </div>

                </form>

                <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post">
                    <button type="submit" class="delete-btn">Sil</button>
                </form>
            </td>

        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
