<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yağız Midye - Admin Paneli</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .add-btn {
            background: #16a34a;
        }

        .delete-btn {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f59e0b;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
        }

        .active {
            padding: 6px 10px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 14px;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 16px;
        }

        .stat-card p {
            margin-top: 10px;
            font-size: 28px;
            font-weight: bold;
        }
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <span>Yağız Midye Admin Paneli</span>
    <a href="/waiter/orders">Garson Paneli</a>
    <a href="/customer/menu">Müşteri Menüsü</a>
    <a href="/logout">Çıkış</a>
</div>

<div class="container">
    <div class="stats-grid">

        <div class="stat-card">
            <h3>Toplam Ürün</h3>
            <p th:text="${productCount}"></p>
        </div>

        <div class="stat-card">
            <h3>Toplam Sipariş</h3>
            <p th:text="${orderCount}"></p>
        </div>

        <div class="stat-card">
            <h3>Toplam Ciro</h3>
            <p th:text="${totalRevenue} + ' TL'"></p>
        </div>

        <div class="stat-card">
            <h3>Bekleyen Sipariş</h3>
            <p th:text="${pendingOrders}"></p>
        </div>

    </div>

    <h1>Ürün Yönetimi</h1>
    <p class="subtitle">Menü ürünlerini buradan ekleyebilir ve silebilirsiniz.</p>

    <div class="form-box">
        <h2>Yeni Ürün Ekle</h2>

        <form th:action="@{/admin/products/add}" th:object="${product}" method="post" class="form-grid">

            <input type="text" th:field="*{name}" placeholder="Ürün adı" required>

            <input type="text" th:field="*{description}" placeholder="Açıklama" required>

            <input type="number" th:field="*{price}" placeholder="Fiyat" step="0.01" required>

            <button type="submit" class="add-btn">
                Ekle
            </button>

        </form>
    </div>

    <h2>Ürün Listesi</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Ürün</th>
            <th>Açıklama</th>
            <th>Fiyat</th>
            <th>Durum</th>
            <th>İşlem</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <form th:action="@{/admin/products/update/{id}(id=${product.id})}" method="post">

                <td th:text="${product.id}"></td>

                <td>
                    <input type="text" name="name" th:value="${product.name}" required>
                </td>

                <td>
                    <input type="text" name="description" th:value="${product.description}" required>
                </td>

                <td>
                    <input type="number" name="price" th:value="${product.price}" step="0.01" required>
                </td>

                <td>
                    <select name="active">
                        <option value="true" th:selected="${product.active == true}">Aktif</option>
                        <option value="false" th:selected="${product.active == false}">Pasif</option>
                    </select>
                </td>

                <td>
                    <button type="submit" class="add-btn">Güncelle</button>
            </form>

            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                <button type="submit" class="delete-btn">Sil</button>
            </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
