<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yağız Midye - Müşteri Menüsü</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 16px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #f59e0b;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }

        input {
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .menu-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 22px;
            align-items: start;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            align-items: flex-start;
        }

        .category-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #f9fafb;
            overflow: hidden;
            align-self: start;
        }

        .category-header {
            padding: 22px;
            cursor: pointer;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header h3 {
            margin: 0;
            color: #111827;
        }

        .arrow {
            font-size: 20px;
            color: #f59e0b;
            font-weight: bold;
        }

        .product-list {
            display: none;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .product-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }

        .product-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background: #e5e7eb;
        }

        .product-item h4 {
            margin: 0 0 6px;
            color: #111827;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 10px;
        }

        .quantity {
            width: 100%;
            box-sizing: border-box;
        }

        .cart-summary {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 20px;
            border-radius: 16px;
            position: sticky;
            top: 20px;
        }

        .cart-summary h2 {
            margin-top: 0;
            color: #111827;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #fed7aa;
            font-size: 14px;
        }

        .cart-row span {
            color: #374151;
        }

        .cart-row strong {
            color: #16a34a;
            white-space: nowrap;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .empty-cart {
            color: #6b7280;
            margin: 0;
        }

        .submit-btn {
            margin-top: 25px;
            width: 100%;
            border: none;
            background: #f59e0b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            .menu-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .customer-info {
                grid-template-columns: 1fr;
            }
        }
        .search-input {
            width: 100%;
            margin-bottom: 25px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }
        .filter-select {
            width: 100%;
            margin-bottom: 25px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
    </style>
</head>

<body>

<div class="navbar">
    <span>Yağız Midye</span>

    <div class="nav-links">
        <a href="/">Ana Sayfa</a>
    </div>
</div>

<div class="container">

    <h1>Müşteri Menüsü</h1>
    <p class="subtitle">Ana ürüne tıklayın, çeşitlerden adet seçip siparişinizi gönderin.</p>
    <input
            type="text"
            id="productSearch"
            class="search-input"
            placeholder="Ürün ara... Örn: midye, kokoreç, hamsi">
    <select id="categoryFilter" class="filter-select">

        <option value="all">Tüm Kategoriler</option>

        <option value="Midye Dolma">Midye Dolma</option>

        <option value="Kokoreç">Kokoreç</option>

        <option value="Çiğköfte">Çiğköfte</option>

        <option value="Balık Ekmek">Balık Ekmek</option>

    </select>

    <form id="orderForm">

        <div class="customer-info">
            <input type="text" id="customerName" placeholder="Adınız" required>
            <input type="text" id="tableNumber" placeholder="Masa No" required>
        </div>

        <div class="menu-layout">

            <div class="category-grid">

                <div class="category-card" th:each="categoryEntry : ${groupedProducts}">

                    <div class="category-header" onclick="toggleCategory(this)">
                        <h3 th:text="${categoryEntry.key}"></h3>
                        <span class="arrow">+</span>
                    </div>

                    <div class="product-list">

                        <div class="product-item" th:each="product : ${categoryEntry.value}">

                            <img class="product-image"
                                 th:if="${product.imageUrl != null and product.imageUrl != ''}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}">

                            <h4 th:text="${product.name}"></h4>

                            <p class="description" th:text="${product.description}"></p>

                            <div class="price" th:text="${product.price} + ' TL'"></div>

                            <input
                                    type="number"
                                    class="quantity"
                                    min="0"
                                    value="0"
                                    th:attr="data-product-id=${product.id},
                                             data-product-name=${product.name},
                                             data-product-price=${product.price}">
                        </div>

                    </div>

                </div>

            </div>

            <div class="cart-summary">
                <h2>Sepet Özeti</h2>

                <div id="cartList">
                    <p class="empty-cart">Sepetiniz boş.</p>
                </div>

                <div class="cart-total">
                    <span>Toplam:</span>
                    <strong id="cartTotal">0.00 TL</strong>
                </div>
            </div>

        </div>

        <button type="submit" class="submit-btn">
            Siparişi Gönder
        </button>

    </form>

</div>

<script>
    function toggleCategory(header) {

        const selectedList = header.nextElementSibling;
        const selectedArrow = header.querySelector(".arrow");

        const isOpen = selectedList.style.display === "block";

        document.querySelectorAll(".product-list").forEach(list => {
            list.style.display = "none";
        });

        document.querySelectorAll(".arrow").forEach(arrow => {
            arrow.textContent = "+";
        });

        if (!isOpen) {
            selectedList.style.display = "block";
            selectedArrow.textContent = "-";
        }
    }

    function updateCartSummary() {
        const cartItems = [];
        let total = 0;

        document.querySelectorAll(".quantity").forEach(input => {
            const quantity = parseInt(input.value) || 0;
            const productName = input.getAttribute("data-product-name");
            const productPrice = parseFloat(input.getAttribute("data-product-price")) || 0;

            if (quantity > 0) {
                const subtotal = quantity * productPrice;
                total += subtotal;

                cartItems.push(`
                    <div class="cart-row">
                        <span>${quantity}x ${productName}</span>
                        <strong>${subtotal.toFixed(2)} TL</strong>
                    </div>
                `);
            }
        });

        const cartList = document.getElementById("cartList");
        const cartTotal = document.getElementById("cartTotal");

        if (cartItems.length === 0) {
            cartList.innerHTML = "<p class='empty-cart'>Sepetiniz boş.</p>";
        } else {
            cartList.innerHTML = cartItems.join("");
        }

        cartTotal.textContent = total.toFixed(2) + " TL";
    }

    document.querySelectorAll(".quantity").forEach(input => {
        input.addEventListener("input", updateCartSummary);
    });

    document.getElementById("orderForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const customerName = document.getElementById("customerName").value;
        const tableNumber = document.getElementById("tableNumber").value;

        const items = [];

        document.querySelectorAll(".quantity").forEach(input => {
            const quantity = parseInt(input.value) || 0;
            const productId = parseInt(input.getAttribute("data-product-id"));

            if (quantity > 0) {
                items.push({
                    productId: productId,
                    quantity: quantity
                });
            }
        });

        if (items.length === 0) {
            alert("Lütfen en az bir ürün seçin.");
            return;
        }

        fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                customerName: customerName,
                tableNumber: tableNumber,
                items: items
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Sipariş oluşturulamadı.");
                }
                return response.json();
            })
            .then(data => {
                window.location.href = "/customer/success";
            })
            .catch(error => {
                alert("Hata oluştu: " + error.message);
            });
    });
    document.getElementById("productSearch").addEventListener("input", function () {
        const searchText = this.value.toLowerCase();

        document.querySelectorAll(".category-card").forEach(categoryCard => {
            let categoryHasVisibleProduct = false;

            categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                const productName = productItem.querySelector("h4").textContent.toLowerCase();

                if (productName.includes(searchText)) {
                    productItem.style.display = "block";
                    categoryHasVisibleProduct = true;
                } else {
                    productItem.style.display = "none";
                }
            });

            const productList = categoryCard.querySelector(".product-list");
            const arrow = categoryCard.querySelector(".arrow");

            if (searchText.length > 0 && categoryHasVisibleProduct) {
                categoryCard.style.display = "block";
                productList.style.display = "block";
                arrow.textContent = "-";
            } else if (searchText.length > 0 && !categoryHasVisibleProduct) {
                categoryCard.style.display = "none";
            } else {
                categoryCard.style.display = "block";
                productList.style.display = "none";
                arrow.textContent = "+";

                categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                    productItem.style.display = "block";
                });
            }
        });
    });
    document.getElementById("categoryFilter").addEventListener("change", function () {

        const selectedCategory = this.value;

        document.querySelectorAll(".category-card").forEach(categoryCard => {

            const categoryName = categoryCard
                .querySelector("h3")
                .textContent
                .trim();

            const productList = categoryCard.querySelector(".product-list");
            const arrow = categoryCard.querySelector(".arrow");

            if (selectedCategory === "all") {

                categoryCard.style.display = "block";

                productList.style.display = "none";

                arrow.textContent = "+";

                categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                    productItem.style.display = "block";
                });

            } else {

                if (categoryName === selectedCategory) {

                    categoryCard.style.display = "block";

                    productList.style.display = "block";

                    arrow.textContent = "-";

                } else {

                    categoryCard.style.display = "none";
                }
            }
        });
    });

    updateCartSummary();
</script>

</body>
</html>
