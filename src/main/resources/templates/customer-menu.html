<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yağız Midye - Müşteri Menüsü</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7ed;
            color: #111827;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 60px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar span {
            color: #f59e0b;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 16px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #f59e0b;
        }

        .container {
            max-width: 1180px;
            margin: 40px auto;
            background: white;
            padding: 34px;
            border-radius: 22px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
            font-size: 38px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
            font-size: 17px;
        }

        input, select {
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            width: 100%;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
        }

        .search-filter-area {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
            background: #fff7ed;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #fed7aa;
        }

        .online-fields {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
            background: #f9fafb;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .online-fields .full {
            grid-column: span 2;
        }

        .card-fields {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 18px;
            border-radius: 16px;
        }

        .card-fields.full {
            grid-column: span 2;
        }

        .card-title {
            grid-column: span 2;
            font-weight: bold;
            color: #111827;
            margin-bottom: 4px;
        }

        .card-help {
            grid-column: span 2;
            font-size: 13px;
            color: #6b7280;
            margin-top: -4px;
        }

        .input-error {
            border-color: #dc2626 !important;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
        }

        .menu-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            align-items: flex-start;
        }

        .category-card {
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            background: #f9fafb;
            overflow: hidden;
            align-self: start;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
        }

        .category-header {
            padding: 22px;
            cursor: pointer;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header h3 {
            margin: 0;
            color: #111827;
        }

        .arrow {
            font-size: 22px;
            color: #f59e0b;
            font-weight: bold;
        }

        .product-list {
            display: none;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .product-item {
            background: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }

        .product-image {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #e5e7eb;
        }

        .product-item h4 {
            margin: 0 0 6px;
            color: #111827;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 10px;
        }

        .quantity {
            width: 100%;
        }

        .cart-summary {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 22px;
            border-radius: 18px;
            position: sticky;
            top: 20px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.08);
        }

        .cart-summary h2 {
            margin-top: 0;
            color: #111827;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #fed7aa;
            font-size: 14px;
        }

        .cart-row strong {
            color: #16a34a;
            white-space: nowrap;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .empty-cart {
            color: #6b7280;
            margin: 0;
        }

        .submit-btn {
            margin-top: 28px;
            width: 100%;
            border: none;
            background: #f59e0b;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            .navbar {
                padding: 18px 25px;
                flex-direction: column;
                gap: 12px;
            }

            .menu-layout,
            .customer-info,
            .online-fields,
            .card-fields,
            .search-filter-area {
                grid-template-columns: 1fr;
            }

            .online-fields .full,
            .card-fields.full,
            .card-title,
            .card-help {
                grid-column: span 1;
            }

            .cart-summary {
                position: static;
            }

            .container {
                margin: 20px;
                padding: 24px;
            }
        }
        .price-box {
            margin-bottom: 10px;
        }

        .old-price {
            text-decoration: line-through;
            color: #9ca3af;
            font-size: 13px;
            margin-right: 8px;
        }

        .discount-badge {
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
            margin-top: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <span>Yağız Midye</span>

    <div class="nav-links">
        <a href="/">Ana Sayfa</a>
    </div>
</div>

<div class="container">

    <h1>Müşteri Menüsü</h1>
    <p class="subtitle">Masada veya online sipariş verebilirsiniz.</p>

    <div class="search-filter-area">
        <input
                type="text"
                id="productSearch"
                class="search-input"
                placeholder="Ürün ara... Örn: midye, kokoreç, hamsi">

        <select id="categoryFilter" class="filter-select">
            <option value="all">Tüm Kategoriler</option>
            <option value="Midye Dolma">Midye Dolma</option>
            <option value="Kokoreç">Kokoreç</option>
            <option value="Çiğköfte">Çiğköfte</option>
            <option value="Balık Ekmek">Balık Ekmek</option>
            <option value="İçecekler">İçecekler</option>
        </select>
    </div>

    <form id="orderForm">

        <div class="customer-info">
            <select id="orderType" onchange="toggleOrderTypeFields()">
                <option value="TABLE">Masada Sipariş</option>
                <option value="ONLINE">Online Sipariş</option>
            </select>

            <input type="text" id="customerName" placeholder="Adınız" required>

            <input type="text" id="tableNumber" placeholder="Masa No" required>
        </div>

        <div id="onlineFields" class="online-fields">
            <input type="text" id="phone" placeholder="Telefon">

            <select id="paymentMethod" onchange="togglePaymentFields()">
                <option value="Kapıda Nakit">Kapıda Nakit</option>
                <option value="Kapıda Kart">Kapıda Kart</option>
                <option value="Online Ödeme">Online Ödeme</option>
            </select>

            <input type="text" id="address" class="full" placeholder="Adres">

            <input type="text" id="note" class="full" placeholder="Sipariş Notu">

            <div id="cardFields" class="card-fields full">
                <div class="card-title">💳  Online Ödeme Bilgileri</div>
                <div class="card-help">Kart numarası 16 haneli olmalıdır. Örnek: 1234567812345678</div>

                <input type="text" id="cardName" placeholder="Kart Üzerindeki İsim">

                <input
                        type="text"
                        id="cardNumber"
                        placeholder="Kart Numarası"
                        maxlength="16"
                        inputmode="numeric">

                <input type="text" id="cardExpiry" placeholder="Son Kullanma Tarihi Örn: 12/28">

                <input
                        type="text"
                        id="cardCvv"
                        placeholder="CVV"
                        maxlength="3"
                        inputmode="numeric">
            </div>
        </div>

        <div class="menu-layout">

            <div class="category-grid">

                <div class="category-card" th:each="categoryEntry : ${groupedProducts}">

                    <div class="category-header" onclick="toggleCategory(this)">
                        <h3 th:text="${categoryEntry.key}"></h3>
                        <span class="arrow">+</span>
                    </div>

                    <div class="product-list">

                        <div class="product-item" th:each="product : ${categoryEntry.value}">

                            <img class="product-image"
                                 th:if="${product.imageUrl != null and product.imageUrl != ''}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}">

                            <h4 th:text="${product.name}"></h4>

                            <p class="description" th:text="${product.description}"></p>

                            <div class="price-box">

                                <div th:if="${product.discountRate != null and product.discountRate > 0}">
                                    <span class="old-price" th:text="${product.price} + ' TL'"></span>

                                    <span class="discount-badge"
                                          th:text="'%' + ${product.discountRate} + ' indirim'">
        </span>

                                    <div class="price"
                                         th:text="${product.price - (product.price * product.discountRate / 100)} + ' TL'">
                                    </div>
                                </div>

                                <div th:if="${product.discountRate == null or product.discountRate == 0}">
                                    <div class="price" th:text="${product.price} + ' TL'"></div>
                                </div>

                            </div>

                            <input
                                    type="number"
                                    class="quantity"
                                    min="0"
                                    value="0"
                                    th:attr="data-product-id=${product.id},
                                             data-product-name=${product.name},
                                             data-product-price=${product.price},
                                             data-product-discount=${product.discountRate}">
                        </div>

                    </div>

                </div>

            </div>

            <div class="cart-summary">
                <h2>Sepet Özeti</h2>

                <div id="cartList">
                    <p class="empty-cart">Sepetiniz boş.</p>
                </div>
                <div id="discountInfo"></div>
                <div class="cart-total">
                    <span>Toplam:</span>
                    <strong id="cartTotal">0.00 TL</strong>
                </div>
            </div>

        </div>

        <button type="submit" class="submit-btn">
            Siparişi Gönder
        </button>

    </form>

</div>

<script>
    function toggleOrderTypeFields() {
        const orderType = document.getElementById("orderType").value;
        const onlineFields = document.getElementById("onlineFields");
        const tableNumber = document.getElementById("tableNumber");
        const phone = document.getElementById("phone");
        const address = document.getElementById("address");

        if (orderType === "ONLINE") {
            onlineFields.style.display = "grid";
            tableNumber.style.display = "none";
            tableNumber.required = false;
            tableNumber.value = "";

            phone.required = true;
            address.required = true;
        } else {
            onlineFields.style.display = "none";
            tableNumber.style.display = "block";
            tableNumber.required = true;

            phone.required = false;
            address.required = false;
        }

        togglePaymentFields();
    }

    function togglePaymentFields() {
        const paymentMethod = document.getElementById("paymentMethod").value;
        const cardFields = document.getElementById("cardFields");

        const cardName = document.getElementById("cardName");
        const cardNumber = document.getElementById("cardNumber");
        const cardExpiry = document.getElementById("cardExpiry");
        const cardCvv = document.getElementById("cardCvv");

        if (paymentMethod === "Online Ödeme") {
            cardFields.style.display = "grid";

            cardName.required = true;
            cardNumber.required = true;
            cardExpiry.required = true;
            cardCvv.required = true;
        } else {
            cardFields.style.display = "none";

            cardName.required = false;
            cardNumber.required = false;
            cardExpiry.required = false;
            cardCvv.required = false;

            cardName.value = "";
            cardNumber.value = "";
            cardExpiry.value = "";
            cardCvv.value = "";

            cardNumber.classList.remove("input-error");
            cardCvv.classList.remove("input-error");
        }
    }

    function toggleCategory(header) {
        const selectedList = header.nextElementSibling;
        const selectedArrow = header.querySelector(".arrow");
        const isOpen = selectedList.style.display === "block";

        document.querySelectorAll(".product-list").forEach(list => {
            list.style.display = "none";
        });

        document.querySelectorAll(".arrow").forEach(arrow => {
            arrow.textContent = "+";
        });

        if (!isOpen) {
            selectedList.style.display = "block";
            selectedArrow.textContent = "-";
        }
    }

    function updateCartSummary() {
        const cartItems = [];
        let total = 0;
        let originalTotal = 0;
        let totalDiscount = 0;

        document.querySelectorAll(".quantity").forEach(input => {
            const quantity = parseInt(input.value) || 0;
            const productName = input.getAttribute("data-product-name");
            const productPrice = parseFloat(input.getAttribute("data-product-price")) || 0;
            const productDiscount = parseFloat(input.getAttribute("data-product-discount")) || 0;

            const finalPrice = productPrice - (productPrice * productDiscount / 100);

            if (quantity > 0) {
                const originalSubtotal = quantity * productPrice;
                const subtotal = quantity * finalPrice;
                const discountAmount = originalSubtotal - subtotal;

                originalTotal += originalSubtotal;
                totalDiscount += discountAmount;
                total += subtotal;

                cartItems.push(`
                    <div class="cart-row">
                        <span>${quantity}x ${productName}</span>
                        <strong>${subtotal.toFixed(2)} TL</strong>
                    </div>
                `);
            }
        });

        const cartList = document.getElementById("cartList");
        const cartTotal = document.getElementById("cartTotal");

        cartList.innerHTML = cartItems.length === 0
            ? "<p class='empty-cart'>Sepetiniz boş.</p>"
            : cartItems.join("");
        const discountInfo = document.getElementById("discountInfo");

        if (totalDiscount > 0) {
            discountInfo.innerHTML = `
        <div class="cart-row">
            <span>İndirimsiz Toplam</span>
            <strong>${originalTotal.toFixed(2)} TL</strong>
        </div>

        <div class="cart-row">
            <span>Toplam İndirim</span>
            <strong>-${totalDiscount.toFixed(2)} TL</strong>
        </div>
    `;
        } else {
            discountInfo.innerHTML = "";
        }

        cartTotal.textContent = total.toFixed(2) + " TL";
    }

    document.querySelectorAll(".quantity").forEach(input => {
        input.addEventListener("input", updateCartSummary);
    });

    document.getElementById("cardNumber").addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 16);
        this.classList.remove("input-error");
    });

    document.getElementById("cardCvv").addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 3);
        this.classList.remove("input-error");
    });

    document.getElementById("orderForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const orderType = document.getElementById("orderType").value;
        const customerName = document.getElementById("customerName").value;
        const tableNumber = document.getElementById("tableNumber").value;

        const items = [];

        document.querySelectorAll(".quantity").forEach(input => {
            const quantity = parseInt(input.value) || 0;
            const productId = parseInt(input.getAttribute("data-product-id"));

            if (quantity > 0) {
                items.push({
                    productId: productId,
                    quantity: quantity
                });
            }
        });

        if (items.length === 0) {
            alert("Lütfen en az bir ürün seçin.");
            return;
        }

        if (orderType === "ONLINE") {
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;

            if (phone.trim() === "" || address.trim() === "") {
                alert("Online sipariş için telefon ve adres zorunludur.");
                return;
            }

            if (document.getElementById("paymentMethod").value === "Online Ödeme") {
                const cardName = document.getElementById("cardName").value;
                const cardNumber = document.getElementById("cardNumber").value;
                const cardExpiry = document.getElementById("cardExpiry").value;
                const cardCvv = document.getElementById("cardCvv").value;

                if (
                    cardName.trim() === "" ||
                    cardNumber.trim() === "" ||
                    cardExpiry.trim() === "" ||
                    cardCvv.trim() === ""
                ) {
                    alert("Demo online ödeme için kart bilgilerini doldurun.");
                    return;
                }

                if (!/^\d{16}$/.test(cardNumber)) {
                    document.getElementById("cardNumber").classList.add("input-error");
                    alert("Kart numarası 16 haneli olmalıdır.");
                    return;
                }

                if (!/^\d{3}$/.test(cardCvv)) {
                    document.getElementById("cardCvv").classList.add("input-error");
                    alert("CVV 3 haneli olmalıdır.");
                    return;
                }
            }
        }

        fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({

                customerName: customerName,

                tableNumber: tableNumber,

                orderType: orderType,

                phone: document.getElementById("phone").value,

                address: document.getElementById("address").value,

                note: document.getElementById("note").value,

                paymentMethod: document.getElementById("paymentMethod").value,

                cardHolderName: document.getElementById("cardName").value,

                cardNumber: document.getElementById("cardNumber").value,

                cardExpiry: document.getElementById("cardExpiry").value,

                cardCvv: document.getElementById("cardCvv").value,

                items: items
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Sipariş oluşturulamadı.");
                }
                return response.json();
            })
            .then(data => {
                window.location.href = "/customer/success";
            })
            .catch(error => {
                alert("Hata oluştu: " + error.message);
            });
    });

    document.getElementById("productSearch").addEventListener("input", function () {
        const searchText = this.value.toLowerCase();

        document.querySelectorAll(".category-card").forEach(categoryCard => {
            let categoryHasVisibleProduct = false;

            categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                const productName = productItem.querySelector("h4").textContent.toLowerCase();

                if (productName.includes(searchText)) {
                    productItem.style.display = "block";
                    categoryHasVisibleProduct = true;
                } else {
                    productItem.style.display = "none";
                }
            });

            const productList = categoryCard.querySelector(".product-list");
            const arrow = categoryCard.querySelector(".arrow");

            if (searchText.length > 0 && categoryHasVisibleProduct) {
                categoryCard.style.display = "block";
                productList.style.display = "block";
                arrow.textContent = "-";
            } else if (searchText.length > 0 && !categoryHasVisibleProduct) {
                categoryCard.style.display = "none";
            } else {
                categoryCard.style.display = "block";
                productList.style.display = "none";
                arrow.textContent = "+";

                categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                    productItem.style.display = "block";
                });
            }
        });
    });

    document.getElementById("categoryFilter").addEventListener("change", function () {
        const selectedCategory = this.value;

        document.querySelectorAll(".category-card").forEach(categoryCard => {
            const categoryName = categoryCard.querySelector("h3").textContent.trim();
            const productList = categoryCard.querySelector(".product-list");
            const arrow = categoryCard.querySelector(".arrow");

            if (selectedCategory === "all") {
                categoryCard.style.display = "block";
                productList.style.display = "none";
                arrow.textContent = "+";

                categoryCard.querySelectorAll(".product-item").forEach(productItem => {
                    productItem.style.display = "block";
                });
            } else {
                if (categoryName === selectedCategory) {
                    categoryCard.style.display = "block";
                    productList.style.display = "block";
                    arrow.textContent = "-";
                } else {
                    categoryCard.style.display = "none";
                }
            }
        });
    });

    toggleOrderTypeFields();
    togglePaymentFields();
    updateCartSummary();
</script>

</body>
</html>
