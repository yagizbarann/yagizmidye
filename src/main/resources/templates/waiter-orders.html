<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yağız Midye - Garson Paneli</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        thead {
            background: #f59e0b;
            color: white;
        }

        th, td {
            padding: 16px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #e0f2fe;
            color: #0369a1;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }

        .preparing-btn {
            background: #f59e0b;
        }

        .ready-btn {
            background: #2563eb;
        }

        .served-btn {
            background: #16a34a;
        }

        .action-buttons button:hover {
            opacity: 0.85;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

    </style>
</head>

<body>

<div class="navbar">
    <span>Yağız Midye Garson Paneli</span>
    <a href="/admin/products">Admin Paneli</a>
    <a href="/customer/menu">Müşteri Menüsü</a>
    <a href="/logout">Çıkış</a>
</div>

<div class="container">

    <h1>Garson Paneli</h1>

    <p class="subtitle">
        Gelen siparişleri buradan takip edebilirsiniz.
    </p>

    <table>

        <thead>
        <tr>
            <th>Sipariş ID</th>
            <th>Müşteri</th>
            <th>Masa</th>
            <th>Ürünler</th>
            <th>Toplam Tutar</th>
            <th>Durum</th>
            <th>İşlem</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="order : ${orders}">

            <td th:text="${order.id}"></td>

            <td th:text="${order.customerName}"></td>

            <td th:text="${order.tableNumber}"></td>
            <td>

                <div th:each="item : ${order.orderItems}">

                    <b th:text="${item.quantity}"></b>x
                    <span th:text="${item.product.name}"></span>

                </div>

            </td>

            <td class="price"
                th:text="${order.totalPrice} + ' TL'">
            </td>

            <td>
                <span class="status"
                      th:text="${order.status}">
                </span>
            </td>

            <td>

                <form action="/waiter/orders/status"
                      method="post"
                      class="action-buttons">

                    <input type="hidden"
                           name="orderId"
                           th:value="${order.id}">

                    <button type="submit"
                            name="status"
                            value="PREPARING"
                            class="preparing-btn">

                        Hazırlanıyor
                    </button>

                    <button type="submit"
                            name="status"
                            value="READY"
                            class="ready-btn">

                        Hazır
                    </button>

                    <button type="submit"
                            name="status"
                            value="SERVED"
                            class="served-btn">

                        Teslim Edildi
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
